# React dashboard (nginx, proxies /api to the backend). Exposed on NodePort 30080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-frontend
  namespace: ebpf-ids
  labels: {app.kubernetes.io/name: ids-frontend, app.kubernetes.io/part-of: ebpf-ids}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ids-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ids-frontend, app.kubernetes.io/part-of: ebpf-ids}
    spec:
      containers:
        - name: frontend
          image: ids-frontend:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: ids-frontend
  namespace: ebpf-ids
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: ids-frontend}
  ports: [{port: 80, targetPort: 8080, nodePort: 30080, name: http}]
