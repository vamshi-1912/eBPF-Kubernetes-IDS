# eBPF sensor: one privileged agent per node (DaemonSet).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ids-agent
  namespace: ebpf-ids
---
# Kubernetes Enrichment Module needs read-only access to pod metadata
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ids-agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ids-agent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ids-agent}
subjects:
  - {kind: ServiceAccount, name: ids-agent, namespace: ebpf-ids}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ids-agent
  namespace: ebpf-ids
  labels: {app.kubernetes.io/name: ids-agent, app.kubernetes.io/part-of: ebpf-ids}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: ids-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ids-agent, app.kubernetes.io/part-of: ebpf-ids}
    spec:
      serviceAccountName: ids-agent
      hostPID: true                 # see (and resolve) every process on the node
      tolerations: [{operator: Exists}]
      containers:
        - name: agent
          image: ids-agent:latest
          imagePullPolicy: Never
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: BACKEND_URL, value: "http://ids-backend.ebpf-ids.svc.cluster.local:8000"}
            - {name: AGENT_TOKEN, valueFrom: {secretKeyRef: {name: ids-secrets, key: agent-token}}}
            - {name: CGROUP_ROOT, value: /host/sys/fs/cgroup}
            - {name: WARMUP_SECONDS, value: "300"}
          securityContext:
            privileged: true          # load eBPF programs, mount tracefs
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: cgroup, mountPath: /host/sys/fs/cgroup, readOnly: true}
      volumes:
        - name: cgroup
          hostPath: {path: /sys/fs/cgroup, type: Directory}
